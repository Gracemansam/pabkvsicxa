spring.application.name=lamiplus_common_api

# ===================================================================
# GENERIC CACHE CONFIGURATION
# ===================================================================
# The cache provider to use. Can be "caffeine" (in-memory) or "redis" (distributed).
# Defaults to "caffeine" if not specified.
caching.provider=caffeine

# --- Caffeine-specific settings (used if caching.provider=caffeine) ---
caching.caffeine.expire-minutes=30
caching.caffeine.initial-capacity=50
caching.caffeine.max-size=200

# --- Redis-specific settings (used if caching.provider=redis) ---
caching.redis.ttl-minutes=60
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=your-redis-password
